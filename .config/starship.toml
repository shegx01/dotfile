add_newline = false
format = "$directory$git_branch$git_status$git_commit$git_metrics\n$character"

[character]
success_symbol = '[ #](bold #c3e88d)'
error_symbol = "[ x](bold #f07178)"
vicmd_symbol = "[ V](bold #c3e88d)"

[directory]
style = "bold #82aaff"
read_only = "(read only)"
read_only_style = "bold #f07178"

[git_branch]
style = "bold #c792ea"

[git_status]
disabled = false
style = "bold #ffcb6b"

[git_commit]
commit_hash_length = 7
tag_disabled = false
only_detached = false
style = "bold #89ddff"

[battery]
disabled = true

[python]
disabled = true

[cmake]
disabled = true

[git_metrics]
disabled = false
added_style = "bold #c3e88d"
deleted_style = "bold #f07178"
format = '([+$added]($added_style)) ([-$deleted]($deleted_style)) '
